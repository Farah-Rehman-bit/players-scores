<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Players Score</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>MATCH</h1>

    <div class="player-space">

        <div class="players">
            <button id="player1Btn">PLAYER 1</button>
            <h2>Score: <span id="score1">0</span></h2>

        <div class="players">
            <button id="player2Btn">PLAYER 2</button>
            <h2>Score: <span id="score2">0</span></h2>
        </div>

    </div>

    <button id="checkScore">CHECK SCORE</button>

<h2 id="result"></h2>

    <script src="script.js"></script>

</body>
</html>
